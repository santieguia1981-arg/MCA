<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro</title>

<body>
<h2>Registro</h2>
<form id="formRegistro" novalidate>
  <input type="text" id="nombre" placeholder="Nombre completo" required><br><br>
  <input type="email" id="email" placeholder="Email" required><br><br>
  <button type="submit" id="btnGuardar">Guardar</button>
</form>
<p id="mensaje"></p>

<script>
const SUPABASE_URL = "https://edszrhzefjzuicsupunt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkc3pyaHplZmp6dWljc3VwdW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzQ1ODEsImV4cCI6MjExMTIxMDU4MX0.8Ilb6NHjwVYulxN10GzHEp9-UA0mfbZR3xbU8azlL-Q";

function esEmailValido(email) {
  // Validación estricta: nombre@dominio.com
  const regex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  return regex.test(email.trim());
}

document.getElementById("formRegistro").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnGuardar");
  const msg = document.getElementById("mensaje");
  const nombre = document.getElementById("nombre").value.trim();
  const dni = document.getElementById("dni").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();

  // --- VALIDACIONES ---
  if (!nombre) {
    msg.textContent = "Poné tu nombre completo";
    msg.style.color = "red";
    return;
  }
  }
  if (!esEmailValido(email)) {
    msg.textContent = "Ese mail no es válido. Tiene que ser como nombre@dominio.com";
    msg.style.color = "red";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Verificando...";
  msg.textContent = "Verificando...";
  msg.style.color = "black";

  try {
    // --- 1. Verificar si el mail ya existe ---
    const checkRes = await fetch(
      SUPABASE_URL + "/rest/v1/perfiles?email=eq." + encodeURIComponent(email) + "&select=email",
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );
    const existentes = await checkRes.json();
    if (existentes.length > 0) {
      msg.textContent = "Ese mail ya está registrado. Usá otro o iniciá sesión.";
      msg.style.color = "red";
      btn.disabled = false;
      btn.textContent = "Guardar";
      return;
    }

    // --- 2. Guardar ---
    btn.textContent = "Guardando...";
    msg.textContent = "Guardando...";

    const res = await fetch(SUPABASE_URL + "/rest/v1/perfiles", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        "Nombre_Completo": nombre,
        "email": email
      })
    });

    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt || res.statusText);
    }

    msg.textContent = "¡Registro guardado! Mail válido ✓";
    msg.style.color = "green";
    document.getElementById("formRegistro").reset();
  } catch (err) {
    console.error(err);
    msg.textContent = "Error: " + err.message;
    msg.style.color = "red";
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar";
  }
});
</script>
  <!-- Modal de login -->
<div id="modalLogin" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#111; color:#fff; padding:24px; border-radius:16px; width:90%; max-width:380px; font-family:sans-serif;">
    <h2 style="margin:0 0 8px;">Iniciar sesión</h2>
    <p style="color:#aaa; font-size:14px; margin:0 0 20px;">Ingresá tu correo para continuar</p>

    <button onclick="loginConGoogle()" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#fff; color:#000; font-weight:600; cursor:pointer; margin-bottom:12px;">
      Continuar con Google
    </button>

    <div style="text-align:center; color:#666; font-size:12px; margin:12px 0;">o</div>

    <input id="emailInput" type="email" placeholder="tu@email.com" style="width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#222; color:#fff; box-sizing:border-box; margin-bottom:12px;">
    
    <button onclick="loginConEmail()" style="width:100%; padding:12px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-weight:600; cursor:pointer;">
      Continuar con correo
    </button>

    <button onclick="document.getElementById('modalLogin').style.display='none'" style="width:100%; padding:10px; background:none; border:none; color:#888; cursor:pointer; margin-top:8px;">

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient(
    "https://edszrhzefjzuicsupunt.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkc3pyaHplZmp6dWljc3VwdW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MzQ1ODEsImV4cCI6MjV4cCI6MjA5MTEyMDU4MX0.8Ilb6NHjwVYulxN10GzHEp9-UA0mfbZR3xbU8azL-Q"
  )

  async function loginConGoogle() {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://mercado-de-capitales-argentino.vercel.app' }
    })
    if (error) alert(error.message)
  }

  async function loginConEmail() {
    const email = document.getElementById('emailInput').value.trim()
    if (!email) return alert('Poné tu email')
    const { error } = await supabaseClient.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: 'https://mercado-de-capitales-argentino.vercel.app' }
    })
    if (error) alert(error.message)
    else alert('¡Listo! Te enviamos un enlace a ' + email + '. Revisá tu mail.')
  }

  // Cuando se loguea, guardamos el email en la tabla perfiles
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      const email = session.user.email
      await supabaseClient.from('perfiles').upsert({ email }, { onConflict: 'email' })
      document.getElementById('modalLogin').style.display = 'none'
      alert('¡Bienvenido! Sesión iniciada con ' + email)
    }
  })
</script>
</body>
